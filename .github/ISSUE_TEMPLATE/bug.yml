name: Something is wrong
description: Report behaviour that is not what it should be
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This has been run in anger on exactly one setup: Windows, with Docker
        inside WSL. CI builds and tests it on Linux and macOS, which proves it
        compiles and that the logic holds — not that it works on your desk.

        So a report from another platform is genuinely useful, and probably the
        first of its kind. Three things below make it answerable without a
        round trip.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        `adev ports` listed nothing, but there are servers running.
        I expected the ports they are listening on.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Output of `adev config`
      description: >
        This says which configuration file is in force and what is in it, which
        is the answer to most "why is it not seeing my projects" questions.
        Passwords are never printed — only which variable they are read from —
        so it is safe to paste. Check it over anyway before you do.
      render: shell
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: The output of `adev --version`, and your OS.
      placeholder: adev 0.7.0, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: What you ran, and what it printed
      description: >
        The whole command and the whole output, including the parts that look
        irrelevant. If a command failed, its error text is the most useful
        thing in this form.
      render: shell
