[package]
name = "aether-dev"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Terminal dashboard for a local development environment"
repository = "https://github.com/muhananaufal/aether-dev"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "adev"
path = "src/main.rs"
