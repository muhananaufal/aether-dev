# Example configuration for adev. Copy it, keep only what you want to change:
# anything left out keeps its default.
#
# Paths resolve against the directory you run adev from, not against this file.

[project]
# Directories that hold projects. A project is a directory containing one of
# artisan, composer.json, package.json, go.mod, Cargo.toml or pyproject.toml.
# Default: the current directory.
roots = ["C:/Projects"]

# How far below each root to look. A directory that is itself a project is not
# descended into, so a project's dependencies never appear as projects.
max_depth = 3

# Never descended into.
ignore = ["node_modules", "vendor", "target", ".git"]

[scan]
# How many repositories git is asked about at once. This is the number the
# whole rewrite is about: the same 24 repositories took 5,983 ms one at a time.
workers = 12

# A repository slower than this is reported as unreadable rather than allowed
# to stall the scan.
git_timeout_ms = 2000

cache_ttl_secs = 30

[docker]
# "auto" follows DOCKER_HOST, the way other docker clients do. Only tcp:// and
# http:// endpoints work in this build; a unix socket or a named pipe is
# reported as an unsupported transport.
#
# Read the note in the README before exposing a daemon over TCP: the Docker
# API is root-equivalent and unauthenticated.
endpoint = "auto"

[caddy]
# Restarted after a domain changes, so the proxy picks up the new config.
container = "caddy-proxy"

# Generated from the domains file. Overwritten on every change - anything
# added here by hand is lost.
caddyfile = "Caddyfile"

# The source of truth for local hostnames. Managed with `adev domains`.
domains = "domains.toml"

# Toolchain versions, for projects that are not in containers.
#
# Nothing is discovered by convention: name the directories your versions live
# in. A subdirectory counts as an install when its name contains a version and
# it actually holds the binary.
#
# [toolchain.php]
# search = ["C:/ProgramData/php"]
# binary = "php.exe"
#
# [toolchain.node]
# search = ["C:/Users/you/AppData/Local/nvm"]
# binary = "node.exe"
#
# [toolchain.go]
# search = ["C:/Go"]
# binary = "go.exe"
# bin_subdir = "bin"     # where the binary sits inside a version directory

# Versions chosen by hand, for the legacy projects whose manifest says nothing
# or says the wrong thing. A pin beats whatever the project declares, and a
# bare version means that version - 7.4 is 7.4.x, not "7.4 or newer".
#
# [pin.old-billing]
# php = "7.4"

# How a project starts. The built-ins cover Laravel, CodeIgniter 3 and 4,
# Django, FastAPI, Next.js, Vite, plain Node, Go, Rust and plain Python.
#
# Replace one for every project that uses it:
# [recipe.laravel]
# command = "php artisan serve --host=0.0.0.0"
# port = 8001
#
# Or replace it for one project only. A project name beats a recipe name,
# because it is more specific and because a project can be called "laravel".
# [run.old-billing]
# command = "php -S localhost:9000 -t public"
# port = 9000

# A toolchain applies to a project that holds one of these files. Without it,
# php assumes composer.json and node assumes package.json, and anything else
# applies only where a [pin] names it — so this is how Go, Python or Ruby
# become relevant without the tool having to know the language exists.
#
# [toolchain.go]
# search = ["C:/Go"]
# binary = "go.exe"
# bin_subdir = "bin"
# when = ["go.mod"]

# The services this machine is meant to have.
#
# Without this section the list is whatever docker reports, which can only ever
# be containers that already exist. A service you have defined but never
# started is exactly the one you open a dashboard to start, so declaring it
# here makes it visible - shown as "absent" until something creates it.
#
# It is also where the details stop being this tool's guesses. The container
# name, the published port, the hostname and the database user are yours.
#
# [service.mysql]
# container = "mysql-db"        # defaults to the name of the service itself
# port = 3306                   # kept on the row even while the container is stopped
# domain = "db.test"            # hostname for `adev domains`
# panel = "http://localhost:8080"   # a page to open with `o`
# user = "root"                 # the user a dump connects as
# password_env = "MYSQL_ROOT_PASSWORD"  # where the password lives in the container
#
# A service with no container of its own needs nothing but a name:
# [service.redis]

# How this machine opens things. The defaults are the obvious ones for the
# platform - `explorer` here, `open` on macOS, `xdg-open` elsewhere - and every
# one of them is wrong for somebody, so both are templates you can replace.
#
# {} is where the URL or the folder goes. A template that never mentions it
# gets the target appended, which is what most openers want anyway.
#
# [open]
# browser = ["firefox", "--new-window", "{}"]
# file_manager = ["code", "{}"]

# What the container host costs, shown in the dashboard footer and by
# `adev services --memory`.
#
# Two different numbers on Windows: how much memory is in use inside the
# machine docker runs in, and what that machine costs Windows. The second is
# usually the one that explains a struggling laptop, and it cannot be seen from
# inside. On native Linux docker there is no second number, so host_process is
# empty there.
#
# The guest command's output is read the way `free -m` prints it.
#
# [memory]
# interval_secs = 5              # 0 turns the footer numbers off entirely
# guest = ["wsl", "-d", "Ubuntu", "-u", "root", "free", "-m"]
# host_process = ["vmmemWSL", "vmmem"]

# Where the dashboard puts a backup. `adev db backup` takes its own --out;
# this is for the `b` key, which has nowhere to ask.
#
# [backup]
# directory = "backups"
# gzip = false
